<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빛으로 흩어지는 초상</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#e6f2ff;font:15px system-ui,sans-serif}
header{position:fixed;z-index:1;inset:0 0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:16px;background:linear-gradient(#000e,transparent);pointer-events:none}
h1{font-size:16px;margin:0 8px 0 0;font-weight:600}
button{pointer-events:auto;background:#10151c;color:inherit;border:1px solid #445369;border-radius:7px;padding:9px 13px;font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#status{flex-basis:100%;margin:1px 0;color:#b2bfd1}
canvas{display:block;width:100%;height:100vh;height:100dvh;touch-action:none}
</style>
</head>
<body>
<header>
 <h1>빛으로 흩어지는 초상</h1>
 <button id="start">웹캠 켜기</button>
 <button id="stop" disabled>끄기</button>
 <button id="reset" disabled>빛 점 복원</button>
 <p id="status" role="status">웹캠을 켜고 화면의 빛 점에 검지를 가져가세요.</p>
</header>
<canvas id="scene" aria-label="검지로 건드리면 위로 흩어지는 얼굴, 머리카락과 목의 빛 점"></canvas>
<video id="camera" autoplay muted playsinline hidden></video>
<script type="module">
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const video=document.getElementById('camera'),status=document.getElementById('status');
const start=document.getElementById('start'),stop=document.getElementById('stop'),reset=document.getElementById('reset');
const visionUrl='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18';
const modelUrl='https://storage.googleapis.com/mediapipe-models';
let models,loading,stream,session=0,frameWidth=1,frameHeight=1,lastFrame=0,lastInference=0,lastVideoTime=-1;
let face=[],finger=null,previousFinger=null,mouseDown=false,smoke=[],nextHit=0;
const erased=new Set();
let silhouette=[],lastMask=-Infinity;
const sprites=['#527ff1','#79c6ff','#ceeeff'].map(color=>{
 const sprite=document.createElement('canvas');
 sprite.width=sprite.height=64;
 const paint=sprite.getContext('2d');
 const glow=paint.createRadialGradient(32,32,0,32,32,32);
 glow.addColorStop(0,color);
 glow.addColorStop(.3,color+'84');
 glow.addColorStop(1,color+'00');
 paint.fillStyle=glow;paint.fillRect(0,0,64,64);
 return sprite;
});
function resize(){
 const bounds=canvas.getBoundingClientRect(),scale=Math.min(devicePixelRatio||1,2);
 frameWidth=bounds.width;frameHeight=bounds.height;
 canvas.width=Math.max(1,Math.round(frameWidth*scale));
 canvas.height=Math.max(1,Math.round(frameHeight*scale));
 ctx.setTransform(scale,0,0,scale,0,0);
 // Old screen coordinates are invalid after orientation or viewport changes.
 face=[];silhouette=[];lastMask=-Infinity;finger=previousFinger=null;smoke=[];
}
new ResizeObserver(resize).observe(canvas);resize();

async function loadModels(){
 if(models)return models;
 if(!loading)loading=(async()=>{
  const {FilesetResolver,FaceLandmarker,HandLandmarker,ImageSegmenter}=await import(visionUrl+'/vision_bundle.mjs');
  const files=await FilesetResolver.forVisionTasks(visionUrl+'/wasm');
  const faceModel=await FaceLandmarker.createFromOptions(files,{
   baseOptions:{modelAssetPath:modelUrl+'/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},
   runningMode:'VIDEO',numFaces:1
  });
  try{
   const handModel=await HandLandmarker.createFromOptions(files,{
    baseOptions:{modelAssetPath:modelUrl+'/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},
    runningMode:'VIDEO',numHands:1
   });
   const segmenter=await ImageSegmenter.createFromOptions(files,{
    baseOptions:{modelAssetPath:modelUrl+'/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite'},
    runningMode:'VIDEO',outputCategoryMask:true,outputConfidenceMasks:false
   }).catch(error=>{console.warn('Hair and neck segmentation unavailable',error);return null;});
   return models={face:faceModel,hand:handModel,segmenter};
  }catch(error){faceModel.close();throw error;}
 })().finally(()=>{loading=null;});
 return loading;
}
start.onclick=async()=>{
 const attempt=++session;
 start.disabled=true;
 status.textContent='카메라를 열고 얼굴과 손 추적을 준비하고 있어요.';
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('HTTPS 주소에서 열어주세요.');
  const camera=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:540}},audio:false});
  if(attempt!==session){camera.getTracks().forEach(track=>track.stop());return;}
  stream=camera;video.srcObject=camera;stop.disabled=false;
  await video.play();
  await loadModels();
  if(attempt!==session)return;
  lastVideoTime=-1;lastInference=0;
  status.textContent='카메라를 바라보고 검지를 얼굴 점에 가져가세요.';
 }catch(error){
  if(attempt!==session)return;
  endCamera();
  status.textContent='카메라 권한과 인터넷 연결을 확인해 주세요. '+error.message;
 }
};
function endCamera(){
 session++;
 stream?.getTracks().forEach(track=>track.stop());
 stream=null;video.srcObject=null;
 face=[];silhouette=[];lastMask=-Infinity;finger=previousFinger=null;mouseDown=false;smoke=[];nextHit=0;erased.clear();
 start.disabled=false;stop.disabled=true;reset.disabled=true;
}
stop.onclick=()=>{endCamera();status.textContent='웹캠을 켜고 화면의 빛 점에 검지를 가져가세요.';};
window.addEventListener('pagehide',endCamera);
reset.onclick=()=>{erased.clear();smoke=[];previousFinger=null;nextHit=performance.now()+280;};

function project(point,transform){
 return {x:transform.x+(1-point.x)*transform.width,y:transform.y+point.y*transform.height};
}
const cloudColumns=37,cloudRows=59;
function sampleSilhouette(mask,anchor){
 const pixels=mask.getAsUint8Array(),points=[];
 for(let row=0;row<cloudRows;row++){
  const yRatio=-.78+row*.045;
  const y=anchor.y+yRatio*anchor.height;
  if(y<0||y>=1)continue;
  for(let col=0;col<cloudColumns;col++){
   const xRatio=(col-(cloudColumns-1)/2)*.058+(row%2)*.029;
   const x=anchor.x+xRatio*anchor.width;
   if(x<0||x>=1)continue;
   const category=pixels[Math.floor(y*mask.height)*mask.width+Math.floor(x*mask.width)];
   // The face mesh already covers face skin. Crop body skin to the neck below the chin.
   const hair=category===1&&yRatio<=1.58;
   const neck=category===2&&yRatio>=.94&&yRatio<=1.57&&Math.abs(xRatio)<.47;
   if(hair||neck)points.push({id:1000+row*cloudColumns+col,xRatio,yRatio,hair});
  }
 }
 return points;
}
function appendSilhouette(t,landmarks,transform){
 if(!landmarks){silhouette=[];lastMask=-Infinity;return;}
 if(!models.segmenter)return;
 const left=landmarks[234],right=landmarks[454],top=landmarks[10],chin=landmarks[152];
 const anchor={x:(left.x+right.x)/2,y:top.y,width:Math.max(.025,Math.abs(right.x-left.x)),height:Math.max(.025,chin.y-top.y)};
 if(t-lastMask>=130){
  lastMask=t;
  try{
   models.segmenter.segmentForVideo(video,t,({categoryMask})=>{
    silhouette=categoryMask?sampleSilhouette(categoryMask,anchor):[];
   });
  }catch(error){
   console.warn('Hair and neck segmentation stopped',error);
   models.segmenter.close();models.segmenter=null;silhouette=[];
  }
 }
 for(const dot of silhouette){
  const point=project({x:anchor.x+dot.xRatio*anchor.width,y:anchor.y+dot.yRatio*anchor.height},transform);
  face.push({...point,id:dot.id,depth:0,silhouette:true,hair:dot.hair});
 }
}
function track(t){
 if(!models||!stream||video.readyState<2||t-lastInference<45||video.currentTime===lastVideoTime)return;
 lastInference=t;lastVideoTime=video.currentTime;
 const fit=Math.min(frameWidth/video.videoWidth,frameHeight/video.videoHeight);
 const scale=frameWidth<frameHeight?Math.max(fit,frameHeight*.62/video.videoHeight):fit;
 const width=video.videoWidth*scale,height=video.videoHeight*scale;
 const transform={x:(frameWidth-width)/2,y:(frameHeight-height)/2,width,height};
 try{
  const landmarks=models.face.detectForVideo(video,t).faceLandmarks[0];
  const hand=models.hand.detectForVideo(video,t).landmarks[0];
  face=landmarks?landmarks.map((point,id)=>{
   const projected=project(point,transform),old=face[id];
   return {x:old?old.x+(projected.x-old.x)*.55:projected.x,
           y:old?old.y+(projected.y-old.y)*.55:projected.y,
           depth:point.z};
  }):[];
  appendSilhouette(t,landmarks,transform);
  reset.disabled=!landmarks;
  status.textContent=landmarks?(models.segmenter?'검지나 화면 터치로 빛 점을 건드려 보세요.':'머리카락과 목 추적을 불러오지 못했어요. 얼굴 점은 사용할 수 있어요.'):'카메라 가운데에 얼굴을 보여주세요.';
  if(!hand){finger=previousFinger=null;return;}
  const tip=project(hand[8],transform);
  previousFinger=finger;finger=tip;
  if(!mouseDown)touchPoint(tip,previousFinger,t);
 }catch(error){
  endCamera();
  status.textContent='추적이 멈췄어요. 웹캠을 다시 켜주세요.';
  console.error(error);
 }
}
function touchPoint(point,previous,t){
 if(t<nextHit||!face.length)return false;
 const dx=previous?point.x-previous.x:0,dy=previous?point.y-previous.y:0;
 const length=dx*dx+dy*dy;
 // Avoid hits along a sudden tracking jump.
 const bridge=length>0&&length<55*55;
 let closest=-1,best=8*8;
 for(let id=0;id<face.length;id++){
  const dot=face[id];
  if(erased.has(dot.id??id))continue;
  const u=bridge?Math.max(0,Math.min(1,((dot.x-previous.x)*dx+(dot.y-previous.y)*dy)/length)):1;
  const x=bridge?previous.x+dx*u:point.x,y=bridge?previous.y+dy*u:point.y;
  const distance=(dot.x-x)**2+(dot.y-y)**2;
  if(distance<best){best=distance;closest=id;}
 }
 if(closest<0)return false;
 erased.add(face[closest].id??closest);nextHit=t+100;
 releaseSmoke(face[closest],dx,dy);
 return true;
}
function releaseSmoke(point,dx,dy){
 const rise=Math.max(24,point.y+55);
 const duration=Math.min(5,Math.max(2.1,rise/185+1.25));
 const drift=Math.max(-55,Math.min(55,dx*1.9));
 for(let i=0;i<24;i++){
  smoke.push({x:point.x,y:point.y,age:0,delay:i*.024,
   duration:duration*(.87+Math.random()*.26),rise:rise+Math.random()*45,
   drift:drift+(Math.random()-.5)*112,phase:Math.random()*Math.PI*2,
   curl:9+Math.random()*25,size:2+Math.random()*9,tone:i%3});
 }
 if(smoke.length>550)smoke.splice(0,smoke.length-550);
}
function drawSmoke(dt){
 smoke=smoke.filter(particle=>{
  particle.age+=dt;
  const t=(particle.age-particle.delay)/particle.duration;
  if(t>=1)return false;
  if(t<0)return true;
  // Draw several dim positions behind the rising particle to leave a light trace.
  for(let echo=3;echo>=0;echo--){
   const u=Math.max(0,t-echo*.026);
   const x=particle.x+particle.drift*u+Math.sin(particle.phase+u*11)*particle.curl*Math.sin(u*Math.PI*.75);
   const y=particle.y-particle.rise*(u*.48+u*u*.52);
   const size=particle.size*(.44+u*2.5);
   ctx.globalAlpha=(1-u)**1.6*(echo===0?.29:.065)*Math.min(1,.28+u*9);
   ctx.drawImage(sprites[particle.tone],x-size,y-size*1.35,size*2,size*2.7);
  }
  return true;
 });
}
function pointAt(event){
 const r=canvas.getBoundingClientRect();
 return {x:event.clientX-r.left,y:event.clientY-r.top};
}
canvas.onpointerdown=event=>{
 if(event.button!==0||!face.length)return;
 mouseDown=true;canvas.setPointerCapture(event.pointerId);
 touchPoint(pointAt(event),null,performance.now());
};
canvas.onpointermove=event=>{if(mouseDown)touchPoint(pointAt(event),null,performance.now());};
canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=()=>{mouseDown=false;};

function render(t){
 const dt=Math.min(.05,(t-lastFrame)/1000||0);lastFrame=t;
 track(t);
 ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='#000';ctx.fillRect(0,0,frameWidth,frameHeight);
 ctx.globalCompositeOperation='lighter';
 for(let id=0;id<face.length;id++){
  const point=face[id];
  if(erased.has(point.id??id))continue;
  const size=point.silhouette?2.6:Math.max(2.4,Math.min(6,3.9-point.depth*22));
  ctx.globalAlpha=point.hair?.46:point.silhouette?.55:.68;
  ctx.drawImage(sprites[1],point.x-size,point.y-size,size*2,size*2);
  ctx.globalAlpha=point.silhouette?.48:.84;
  ctx.fillStyle='#d3ebff';ctx.fillRect(point.x-.55,point.y-.55,1.1,1.1);
 }
 drawSmoke(dt);
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 if(finger){
  ctx.strokeStyle='#a2dbff9c';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(finger.x,finger.y,7,0,Math.PI*2);ctx.stroke();
 }
 requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
